joy_teleop:
  ros__parameters:
    move:
      type: topic
      interface_type: geometry_msgs/msg/TwistStamped
      # Publish to the twist_mux joystick input, not straight to the controller.
      topic_name: joy_vel
      deadman_buttons: [7]   # RB over Bluetooth (= button 5 over USB)
      # Xbox X|S pad over BLUETOOTH (indices differ from USB!):
      #   right stick vertical   = axis 3, forward = -1 -> forward/back (scale -)
      #   left stick horizontal  = axis 0, left    = +1 -> turn
      #   deadman RB             = button 7
      axis_mappings:
        twist-linear-x:
          axis: 3          # right stick: forward/back
          scale: 2.0
          offset: 0.0
        twist-angular-z:
          axis: 0          # left stick: turn left/right
          scale: -1.7
          offset: 0.0
