joy_teleop:
  ros__parameters:
    move:
      type: topic
      interface_type: geometry_msgs/msg/TwistStamped
      # Publish to the twist_mux joystick input, not straight to the controller.
      topic_name: joy_vel
      deadman_buttons: [5]   # RB over USB (= button 7 over Bluetooth)
      # Xbox X|S pad over USB (indices differ from Bluetooth!):
      #   right stick vertical   = axis 4, forward = +1 -> forward/back
      #   left stick horizontal  = axis 0, left    = +1 -> turn
      #   deadman RB             = button 5
      axis_mappings:
        twist-linear-x:
          axis: 4          # right stick: forward/back
          scale: 2.0
          offset: 0.0
        twist-angular-z:
          axis: 0          # left stick: turn left/right
          scale: -1.7
          offset: 0.0
