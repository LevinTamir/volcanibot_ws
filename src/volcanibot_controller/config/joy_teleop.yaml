joy_teleop:
  ros__parameters:
    move:
      type: topic
      interface_type: geometry_msgs/msg/TwistStamped
      # Publish to the twist_mux joystick input, not straight to the
      # controller. twist_mux arbitrates joystick vs. autonomy (nav_vel)
      # and forwards the winner to volcanibot_controller/cmd_vel.
      topic_name: joy_vel
      deadman_buttons: [5]   # RB on an Xbox pad
      # Xbox X|S pad (measured on this controller):
      #   right stick vertical   = axis 4, forward = +  -> forward/back
      #   left stick horizontal  = axis 0, left    = +  -> turn (left = +z = CCW)
      axis_mappings:
        twist-linear-x:
          axis: 4          # right stick: forward/back
          scale: 2.0
          offset: 0.0
        twist-angular-z:
          axis: 0          # left stick: turn left/right
          scale: -1.7
          offset: 0.0
